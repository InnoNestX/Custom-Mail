name: Docker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker/**
      - wrangler.docker.jsonc
      - Cargo.toml
      - Cargo.lock
      - package.json
      - src/**
      - templates/**
      - config/**
      - public/**
      - .github/workflows/docker.yml

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Require Docker Hub secrets
        shell: bash
        run: |
          if [[ -z "${DOCKERHUB_USERNAME}" || -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "::error::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN must be set so :latest and version tags publish to Docker Hub."
            exit 1
          fi

      - name: Read version
        id: version
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Emulate non-native arches (arm64 / armv7) on the amd64 runner.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAGS="ghcr.io/innonestx/custom-mail:latest"
          TAGS="${TAGS},ghcr.io/innonestx/custom-mail:${VERSION}"
          TAGS="${TAGS},${DOCKERHUB_USERNAME}/custom-mail:latest"
          TAGS="${TAGS},${DOCKERHUB_USERNAME}/custom-mail:${VERSION}"
          echo "tags=${TAGS}" >> "${GITHUB_OUTPUT}"

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Covers Intel/AMD PCs & servers, Apple Silicon / Windows arm64 Docker Desktop,
          # Raspberry Pi 4/5 (64-bit), and older 32-bit ARM boards (arm/v7).
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          # Attestations otherwise appear as extra untagged / unknown-arch versions in GHCR.
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=custom-mail
            org.opencontainers.image.description=Private web mail console on Cloudflare Workers (pluggable ESP)
            org.opencontainers.image.source=https://github.com/InnoNestX/Custom-Mail
            org.opencontainers.image.url=https://github.com/InnoNestX/Custom-Mail
            org.opencontainers.image.documentation=https://innonestx.github.io/Custom-Mail/
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
