name: Docker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker/**
      - wrangler.docker.jsonc
      - Cargo.toml
      - Cargo.lock
      - package.json
      - src/**
      - templates/**
      - config/**
      - public/**
      - .github/workflows/docker.yml

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAGS="ghcr.io/innonestx/custom-mail:latest"
          TAGS="${TAGS},ghcr.io/innonestx/custom-mail:${VERSION}"
          if [[ -n "${DOCKERHUB_USERNAME}" ]]; then
            TAGS="${TAGS},${DOCKERHUB_USERNAME}/custom-mail:latest"
            TAGS="${TAGS},${DOCKERHUB_USERNAME}/custom-mail:${VERSION}"
          fi
          echo "tags=${TAGS}" >> "${GITHUB_OUTPUT}"

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=custom-mail
            org.opencontainers.image.source=https://github.com/InnoNestX/Custom-Mail
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
