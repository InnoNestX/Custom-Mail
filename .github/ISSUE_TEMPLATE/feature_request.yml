name: Feature request
description: Suggest an improvement to Custom Mail.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      placeholder: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Compose UI
        - Send / providers
        - Attachments
        - Send history
        - Mobile (H5)
        - Config / branding
        - Deployment
        - Documentation
        - Other
    validations:
      required: true
