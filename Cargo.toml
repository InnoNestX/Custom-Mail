[package]
name = "custom-mail"
version = "0.2.0"
edition = "2021"
description = "Custom Mail — private web mail console on Cloudflare Workers (Rust)"
license = "MIT"
repository = "https://github.com/InnoNestX/Custom-Mail"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.8.5", features = ["http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
